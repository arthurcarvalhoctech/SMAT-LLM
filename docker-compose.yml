services:
  smat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        INSTALL_LAYA: ${INSTALL_LAYA:-false}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: smat-ubuntu
    container_name: smat_container
    environment:
      # Dataset root. The input JSON resolves ${PATH_DATASET}/... with it.
      - PATH_DATASET=${PATH_DATASET:?Define PATH_DATASET in the .env file}
      # Lets scripts/*.py import the nimrod package.
      - PYTHONPATH=/app/SMAT
      # Provider selection (DeepSeek, OpenAI-compatible, Gemini or Ollama).
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_KEY=${LLM_MODEL_KEY:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-}
      - LLM_SEED=${LLM_SEED:-}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-}
      - LLM_NUM_OUTPUTS=${LLM_NUM_OUTPUTS:-}
      - LLM_PROMPT_KEYS=${LLM_PROMPT_KEYS:-}
      - LLM_PROMPT_TEMPLATE=${LLM_PROMPT_TEMPLATE:-}
      # Test-based dynamic interference detection pipeline (true/false).
      - SMAT_DYNAMIC_INTERFERENCE_DETECTION=${SMAT_DYNAMIC_INTERFERENCE_DETECTION:-true}
      # Laya pre-analysis flow (optional; true/false).
      - SMAT_LAYA_INTERFERENCE_DETECTION=${SMAT_LAYA_INTERFERENCE_DETECTION:-false}
      - SMAT_LAYA_MODEL=${SMAT_LAYA_MODEL:-english}
      - SMAT_LAYA_THRESHOLD=${SMAT_LAYA_THRESHOLD:-0.5}
      - SMAT_LAYA_THRESHOLDS=${SMAT_LAYA_THRESHOLDS:-}
      - SMAT_LAYA_DECISION_RULE=${SMAT_LAYA_DECISION_RULE:-baseline}
      - SMAT_LAYA_STATE_FORMAT=${SMAT_LAYA_STATE_FORMAT:-json}
      - SMAT_LAYA_WITNESS=${SMAT_LAYA_WITNESS:-false}
      - SMAT_LAYA_WITNESS_TWO_STAGE=${SMAT_LAYA_WITNESS_TWO_STAGE:-false}
      - SMAT_LAYA_ALLOW_BASELINE_WITH_WITNESS=${SMAT_LAYA_ALLOW_BASELINE_WITH_WITNESS:-false}
      - SMAT_LAYA_NEGATIVE_INSTRUCTIONS=${SMAT_LAYA_NEGATIVE_INSTRUCTIONS:-true}
      - SMAT_LAYA_DIAGNOSTIC_QUESTIONS=${SMAT_LAYA_DIAGNOSTIC_QUESTIONS:-false}
      - SMAT_LAYA_MAX_LEN=${SMAT_LAYA_MAX_LEN:-512}
      - SMAT_LAYA_LOG_DIR=${SMAT_LAYA_LOG_DIR:-}
      # LLM-based interference pre-analysis flow (optional; true/false).
      - SMAT_LLM_INTERFERENCE_DETECTION=${SMAT_LLM_INTERFERENCE_DETECTION:-false}
      - SMAT_LLM_INTERFERENCE_THRESHOLD=${SMAT_LLM_INTERFERENCE_THRESHOLD:-0.5}
      - SMAT_LLM_INTERFERENCE_MAX_INPUT_CHARS=${SMAT_LLM_INTERFERENCE_MAX_INPUT_CHARS:-24000}
      - SMAT_LLM_INTERFERENCE_MODEL=${SMAT_LLM_INTERFERENCE_MODEL:-}
      - SMAT_LLM_INTERFERENCE_FALLBACK_MODEL=${SMAT_LLM_INTERFERENCE_FALLBACK_MODEL:-}
      - SMAT_LLM_INTERFERENCE_MAX_OUTPUT_TOKENS=${SMAT_LLM_INTERFERENCE_MAX_OUTPUT_TOKENS:-8192}
      - SMAT_LLM_INTERFERENCE_JSON_MODE=${SMAT_LLM_INTERFERENCE_JSON_MODE:-true}
      - SMAT_LLM_INTERFERENCE_RETRY_ON_LENGTH=${SMAT_LLM_INTERFERENCE_RETRY_ON_LENGTH:-true}
      - SMAT_LLM_INTERFERENCE_LOG_DIR=${SMAT_LLM_INTERFERENCE_LOG_DIR:-}
      # true: the LLM test generator keeps only the class fields used by the
      # method or touched by the change (see context_filter.py).
      - SMAT_CONTEXT_FILTER=${SMAT_CONTEXT_FILTER:-false}
      # Hugging Face cache/download settings for Laya.
      - HF_HOME=${HF_HOME:-/home/appuser/.cache/huggingface}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}
      - HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-120}
      - HF_HUB_ETAG_TIMEOUT=${HF_HUB_ETAG_TIMEOUT:-30}
      # Provider-specific keys.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    extra_hosts:
      # Allows Ollama running on the host to be reached from the container.
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount the current directory to /app in the container
      - .:/app
      # mergedataset checkout, mounted at the same path it has on the host
      # (PATH_DATASET), so ${PATH_DATASET}/... works inside the container too.
      - ${PATH_DATASET:?Define PATH_DATASET in the .env file}:${PATH_DATASET:?Define PATH_DATASET in the .env file}:ro
      # Local Laya checkpoints (e.g. the fine-tuned model), read-only. Point
      # SMAT_LAYA_MODEL at /laya_smat/<checkpoint dir> to use one.
      - ${LAYA_SMAT_DIR:-./.laya_smat}:/laya_smat:ro
      # Persist Hugging Face weights downloaded by Laya between runs.
      - smat-hf-cache:/home/appuser/.cache/huggingface
      # Persist Hugging Face weights on the host, which has more free space
      # than the Docker root filesystem. Adjust HF_CACHE_DIR in .env if needed.
      - ${HF_CACHE_DIR:-/home/arthur/.cache/huggingface}:/home/appuser/.cache/huggingface
      # Mount the ASTER dataset read-only. Uncomment and adjust the host path.
      # - /caminho/aster:/data/aster:ro
    stdin_open: true
    tty: true

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    image: smat-scenario-viewer
    container_name: smat_viewer
    ports:
      - "${VIEWER_PORT:-3000}:3000"
    environment:
      # Read-only root for the Next.js data layer.
      - SMAT_OUTPUT_DIR=/data/output-test-dest
    volumes:
      # The viewer only reads the SMAT artifacts.
      - ./SMAT/output-test-dest:/data/output-test-dest:ro
    restart: unless-stopped

volumes:
  smat-hf-cache:
